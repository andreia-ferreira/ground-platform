name: Set up environment
description: Sets up Node.js, pnpm, Nx cache, and installs dependencies

inputs:
  cache-key-suffix:
    description: Suffix for the Nx cache key (e.g. job name)
    required: false
    default: default
  install-chrome:
    description: 'Whether to install Google Chrome'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Force Angular 20 versions
      shell: bash
      run: |
        pnpm add -w \
        @angular/core@20.3.18 \
        @angular/compiler@20.3.18 \
        @angular/compiler-cli@20.3.18 \
        @angular/cli@20.3.18

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        NX_REJECT_UNKNOWN_LOCAL_CACHE: '0'

    - name: Install Chrome
      if: ${{ inputs.install-chrome == 'true' }}
      uses: browser-actions/setup-chrome@v1
      id: setup-chrome
      with:
        chrome-version: stable

    - name: Configure Chrome Environment
      if: ${{ inputs.install-chrome == 'true' }}
      shell: bash
      run: |
        echo "CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }}" >> $GITHUB_ENV
        echo "CHROME_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> $GITHUB_ENV
